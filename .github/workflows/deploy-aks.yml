name: Deploy to AKS

# Manual or on a version tag. Authenticates with OIDC federation: no stored cloud secret.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push images to ACR
        run: |
          az acr login --name "${REGISTRY%%.*}"
          build() { docker build -f "$1" ${3:+--build-arg "$3"} -t "$REGISTRY/$2:${GITHUB_SHA}" . && docker push "$REGISTRY/$2:${GITHUB_SHA}"; }
          build deploy/docker/spring.Dockerfile benchline-pricing-api APP=pricing-api
          build deploy/docker/spring.Dockerfile benchline-benchmark-worker APP=benchmark-worker
          build deploy/docker/ml.Dockerfile benchline-ml-service
          build deploy/docker/web.Dockerfile benchline-web
          build deploy/docker/migrate.Dockerfile benchline-migrate
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_NAME }}
      - uses: azure/setup-helm@v4
      - name: Helm upgrade
        run: |
          helm upgrade --install benchline deploy/helm/benchline \
            --namespace benchline --create-namespace \
            -f deploy/helm/benchline/values-aks.yaml \
            --set global.imageRegistry="$REGISTRY" \
            --set global.imageTag="${GITHUB_SHA}" \
            --set ingress.host="${{ vars.PUBLIC_HOST }}" \
            --set secretsStore.keyVaultName="${{ vars.KEY_VAULT_NAME }}" \
            --set secretsStore.tenantId="${{ vars.AZURE_TENANT_ID }}" \
            --set secretsStore.userAssignedIdentityClientId="${{ vars.CSI_IDENTITY_CLIENT_ID }}" \
            --wait --timeout 10m
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            "https://${{ vars.PUBLIC_HOST }}/api/v1/config"
