[project]
name = "benchline-warehouse"
version = "0.1.0"
description = "Benchline gold tables in a warehouse, modelled with dbt"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "dbt-snowflake>=1.10",
    "duckdb>=1.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
