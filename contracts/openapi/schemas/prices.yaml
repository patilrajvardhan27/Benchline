PricePointInput:
  type: object
  required: [ndc11, description, source, unitPrice, pricingUnit, effectiveDate, asOfDate]
  properties:
    ndc11: { type: string, pattern: '^[0-9]{11}$' }
    description: { type: string, minLength: 1, maxLength: 300 }
    otc: { type: boolean, default: false }
    source: { $ref: ./items.yaml#/PriceSource }
    unitPrice: { $ref: ./common.yaml#/Money }
    pricingUnit: { type: string, minLength: 1, maxLength: 8 }
    effectiveDate: { type: string, format: date }
    asOfDate: { type: string, format: date }
    groupName:
      type: string
      minLength: 1
      maxLength: 300
      description: |
        Optional normalized product name, for example "ATORVASTATIN 20 MG TABLET". Products that
        share it are benchmarked together. When omitted, the group is made from description.
PricePointBatch:
  type: object
  required: [pricePoints]
  properties:
    pricePoints:
      type: array
      minItems: 1
      maxItems: 1000
      items: { $ref: '#/PricePointInput' }
IngestReceipt:
  type: object
  required: [accepted, duplicates]
  properties:
    accepted: { type: integer, minimum: 0 }
    duplicates:
      type: integer
      minimum: 0
      description: Rows already stored for the same item, source and effective date.
