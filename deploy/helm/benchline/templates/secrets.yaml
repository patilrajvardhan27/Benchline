{{- if .Values.devSecrets.enabled }}
# Local and CI only. Real clusters use Key Vault through the CSI driver.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "benchline.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "devSecrets.postgresPassword is required" .Values.devSecrets.postgresPassword | quote }}
  DEV_JWT_SECRET: {{ required "devSecrets.jwtSecret is required" .Values.devSecrets.jwtSecret | quote }}
{{- end }}
{{- if .Values.secretsStore.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: benchline-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.secretsStore.userAssignedIdentityClientId | quote }}
    keyvaultName: {{ .Values.secretsStore.keyVaultName | quote }}
    tenantId: {{ .Values.secretsStore.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
          objectAlias: POSTGRES_PASSWORD
  secretObjects:
    - secretName: {{ .Values.secretName }}
      type: Opaque
      data:
        - { objectName: POSTGRES_PASSWORD, key: POSTGRES_PASSWORD }
{{- end }}
