{{- if .Values.infra.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "benchline.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.infra.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432 }]
{{- end }}
{{- if .Values.infra.kafka.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "benchline.labels" . | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka }
    spec:
      containers:
        - name: kafka
          image: {{ .Values.infra.kafka.image }}
          ports: [{ name: broker, containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
          readinessProbe:
            tcpSocket: { port: broker }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.infra.kafka.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports: [{ name: broker, port: 9092 }]
{{- end }}
{{- if .Values.infra.flagd.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: flagd-flags }
data:
  flags.flagd.json: |
    {{- .Files.Get "files/flags.flagd.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    {{- include "benchline.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: flagd }
  template:
    metadata:
      labels: { app.kubernetes.io/name: flagd }
    spec:
      containers:
        - name: flagd
          image: {{ .Values.infra.flagd.image }}
          args: ["start", "--uri", "file:/etc/flagd/flags.flagd.json"]
          ports: [{ name: rpc, containerPort: 8013 }]
          volumeMounts: [{ name: flags, mountPath: /etc/flagd }]
      volumes:
        - name: flags
          configMap: { name: flagd-flags }
---
apiVersion: v1
kind: Service
metadata: { name: flagd }
spec:
  selector: { app.kubernetes.io/name: flagd }
  ports: [{ name: rpc, port: 8013 }]
{{- end }}
