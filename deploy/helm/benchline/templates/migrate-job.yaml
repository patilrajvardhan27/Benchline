# Applies Flyway migrations before the application pods start or upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: benchline-migrate
  labels:
    {{- include "benchline.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "benchline.image" (dict "root" . "image" .Values.migrate.image) }}
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          args:
            - -url=jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}
            - -user=$(POSTGRES_USER)
            - -password=$(POSTGRES_PASSWORD)
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD }
