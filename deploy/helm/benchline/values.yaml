global:
  imageRegistry: ghcr.io/your-account   # set per environment
  imageTag: latest
  pullPolicy: IfNotPresent

# Application services. One entry here produces a Deployment and a Service.
services:
  pricing-api:
    image: benchline-pricing-api
    port: 8080
    replicas: 1
    probe: /actuator/health
    secretEnv: [POSTGRES_PASSWORD]
    optionalSecretEnv: [DEV_JWT_SECRET]   # only present for local and CI clusters
    env:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ""
      OIDC_ISSUER_URI: ""
    resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
  benchmark-worker:
    image: benchline-benchmark-worker
    port: 8081
    replicas: 1
    probe: /actuator/health
    secretEnv: [POSTGRES_PASSWORD]
    env: {}
    resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } }
  ml-service:
    image: benchline-ml-service
    port: 8000
    replicas: 1
    probe: /healthz
    secretEnv: [POSTGRES_PASSWORD]
    env: {}
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  web:
    image: benchline-web
    port: 8080
    replicas: 1
    probe: /healthz
    secretEnv: []
    env: {}
    resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 64Mi } }

postgres:
  host: postgres          # an external host on AKS, e.g. an Azure Database server
  port: 5432
  database: benchline
  user: benchline

kafka:
  bootstrap: kafka:9092

flagd:
  host: flagd
  port: 8013

# Cluster-local infrastructure. Turn these off when using managed services.
infra:
  postgres: { enabled: true, image: "postgres:16-alpine", storage: 5Gi }
  kafka: { enabled: true, image: "apache/kafka:3.9.1", storage: 5Gi }
  flagd: { enabled: true, image: "ghcr.io/open-feature/flagd:v0.19.2" }

migrate:
  image: benchline-migrate

ingress:
  enabled: false
  className: ""
  host: benchline.example.com
  tls: { enabled: true, secretName: benchline-tls }
  annotations: {}

# Dev secrets created by the chart (kind). On AKS leave empty and use secretsStore.
devSecrets:
  enabled: false
  postgresPassword: ""
  jwtSecret: ""

# Azure Key Vault CSI driver: syncs vault secrets into the Secret the pods read.
secretsStore:
  enabled: false
  keyVaultName: ""
  tenantId: ""
  userAssignedIdentityClientId: ""

secretName: benchline-secrets

networkPolicy: { enabled: true }
podDisruptionBudget: { enabled: false }

otel:
  enabled: false
  endpoint: http://otel-collector:4317
  agentPath: /otel/agent.jar
